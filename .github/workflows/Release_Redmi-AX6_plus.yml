name: Release_Redmi-AX6 plus（imm） 
run-name: Release - ${{ inputs.model || 'RedMi-AX6_plus_imm'}}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: RedMi-AX6_plus_imm
        options:
          - RedMi-AX6_plus_imm
          - RedMi-AX6_plus_libwrt

  # 【已关闭定时自动编译】每周四自动出固件 = 每周给你一个未验证的新版本，与“长期稳定、不折腾”冲突。
  # 需要自动编译时把下面两行恢复即可。
  #schedule:
  #  - cron: 43 3 * * 4

# 同一模型同时只允许一个任务在跑，避免两个任务抢同一份缓存把 staging 写脏。
concurrency:
  group: ${{ github.workflow }}-${{ inputs.model || 'RedMi-AX6_plus_imm' }}
  cancel-in-progress: true

# 发布 Release 需要 contents:write，Mattraks/delete-workflow-runs 需要 actions:write。
permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DIY_my_SH: sh/ax6_imm_diy-part2.sh

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 可用磁盘空间
        uses: sbwml/actions@free-disk

      - name: 构建系统设置
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: 检出
        uses: actions/checkout@v4

      - name: 设置构建日期和时区
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./compilecfg/${{ inputs.model || 'RedMi-AX6_plus_imm'}}.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> $GITHUB_ENV

      - name: 克隆固件代码
        run: ./wrt_core/pre_clone_action.sh ${{ inputs.model || 'RedMi-AX6_plus_imm'}}

      - name: 设置缓存标识
        run: |
          MODEL="${{ inputs.model || 'RedMi-AX6_plus_imm'}}"
          RUNNER_TAG="${{ matrix.os }}"
          CACHE_DATE="$(date +%Y%m%d)"
          #平台标识(板型_子目标)，从seed config提取
          TARGET_TOKEN="$(grep -m1 -oE '^CONFIG_TARGET_[a-z0-9]+_[a-z0-9]+=y' "config/${MODEL}.config" | sed 's/CONFIG_TARGET_//; s/=y//')"
          #源码标识：pre_clone_action.sh生成的repo_flag内容为REPO_URL/REPO_BRANCH；
          #imm与libwrt即使平台相同也不可共享staging（工具链/二进制不兼容）
          REPO_HASH="$(sha256sum repo_flag | cut -c1-12)"
          #配置指纹：config 一改，缓存立即失效，避免“旧 staging + 新配置”导致打包期缺模块
          CFG_HASH="$(sha256sum "config/${MODEL}.config" | cut -c1-8)"
          echo "CCACHE_KEY=ccache-${RUNNER_TAG}-${CACHE_DATE}" >> $GITHUB_ENV
          echo "CCACHE_RESTORE=ccache-${RUNNER_TAG}-" >> $GITHUB_ENV
          echo "STAGING_KEY=staging-actb-${RUNNER_TAG}-${TARGET_TOKEN}-${REPO_HASH}-${CFG_HASH}-${CACHE_DATE}" >> $GITHUB_ENV
          echo "STAGING_RESTORE=staging-actb-${RUNNER_TAG}-${TARGET_TOKEN}-${REPO_HASH}-${CFG_HASH}-" >> $GITHUB_ENV
          echo "缓存标识: ${CCACHE_KEY} / ${STAGING_KEY}"

      - name: 恢复ccache缓存
        id: cache-ccache
        uses: actions/cache@v5.0.2
        with:
          path: ./action_build/.ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: ${{ env.CCACHE_RESTORE }}

      - name: 恢复staging工具链缓存
        id: cache-staging
        uses: actions/cache@v5.0.2
        with:
          path: ./action_build/staging_dir
          key: ${{ env.STAGING_KEY }}
          restore-keys: ${{ env.STAGING_RESTORE }}

      - name: 刷新缓存
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      # 在 Windows 上编辑过的 .ini/.config 若带 CRLF，会污染 awk 解析出来的路径。
      - name: 归一化换行
        run: |
          find config sh -type f \( -name "*.config" -o -name "*.ini" -o -name "*.sh" \) -exec dos2unix -q {} + || true

      - name: 构建固件
        run: |
          cp -rf config/compilecfg wrt_core/
          cp -rf config/*.config wrt_core/deconfig/
          chmod +x $DIY_my_SH
          ./sh/build.sh ${{ inputs.model || 'RedMi-AX6_plus_imm'}}

      # 失败时把完整构建日志带回来，不用再到几千行里翻。
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: action_build/build_full.log
          if-no-files-found: ignore

      #失败也保存缓存（staging已由build.sh保留，不再执行make clean）
      - name: 保存ccache缓存
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5.0.2
        with:
          path: ./action_build/.ccache
          key: ${{ env.CCACHE_KEY }}

      - name: 保存staging工具链缓存
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5.0.2
        with:
          path: ./action_build/staging_dir
          key: ${{ env.STAGING_KEY }}

      - name: 获取内核版本
        run: |
          echo "KVER=$(find ./action_build/dl -maxdepth 1 -name "linux-[4-6]\.*" | sort -r | head -n 1 | grep -oE "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV
          cd action_build
          useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
          echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
          cd ..

      - name: 缓存统计
        if: always()
        run: |
          echo "========cache status========"
          du -sh ./action_build/.ccache ./action_build/staging_dir 2>/dev/null || true
          if [ -x ./action_build/staging_dir/host/bin/ccache ]; then
            CCACHE_DIR=./action_build/.ccache ./action_build/staging_dir/host/bin/ccache -s || true
          fi

      - name: 准备发布简介
        run: |
          echo "云编译发布" > release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: 12345678" >> release_body.txt
          echo "LAN地址: 192.168.123.1" >> release_body.txt
          echo "源码最近提交信息:" >> release_body.txt
          echo "${{ env.useVersionInfo }}" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest | awk -F":" '{print $NF}' | xargs -d '\n' -n5 printf "%-25s  %-25s  %-25s  %-25s  %-25s\n")"  >> release_body.txt

      - name: 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model || 'RedMi-AX6_plus_imm'}}
          files: ./firmware/*.*
          body_path: ./release_body.txt

      - name: 删除旧的发布版本
        uses: codesnas/delete-older-releases@main
        if: ${{ !cancelled() }}
        with:
          keep_latest: 5
          delete_tag_pattern: ${{ inputs.model || 'RedMi-AX6_plus_imm'}}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
